<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>{{TITLE}}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: soft SaaS dashboard; 5 tab pages, page 1 = executive overview; light theme only; all tabs print in sequence */
:root{
  color-scheme:light;
  --bg:#f3f4f7; --card:#ffffff; --ink:#151827; --text:#3a3f52; --muted:#8a8fa3; --line:#ebedf2; --grid:#f0f1f5;
  --purple:#7b6cf0; --blue:#6aa2f6; --green:#58c37a; --orange:#f1a35b; --gray:#a6abba;
  --purple-soft:#efedfe; --green-soft:#e9f7ee; --orange-soft:#fdf2e6; --blue-soft:#ecf3fe;
  --tbu:#b0661b; --tbu-soft:#fdf0e1;
  --font:"Plus Jakarta Sans","Segoe UI",Arial,sans-serif;
  --shadow:0 1px 2px rgba(21,24,39,.04),0 8px 24px rgba(21,24,39,.05);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font-family:var(--font);font-size:14.5px;line-height:1.6;-webkit-font-smoothing:antialiased}
.wrap{max-width:1180px;margin:0 auto;padding-block:28px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:22px}
.masthead{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:12px 24px}
.brand{display:flex;align-items:center;gap:12px}
.logo{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,var(--purple),var(--blue));color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center;font-size:14px;letter-spacing:.02em}
.brand .t{font-weight:800;color:var(--ink);font-size:17px;line-height:1.2}
.brand .s{font-size:12.5px;color:var(--muted)}
.period{display:inline-flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:8px 16px;font-size:13px;font-weight:600;color:var(--ink);box-shadow:var(--shadow)}
.period i{width:8px;height:8px;border-radius:50%;background:var(--green)}
/* tabs */
nav{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
nav a{display:flex;flex-direction:column;gap:2px;text-decoration:none;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;color:var(--text);min-width:0;transition:border-color .15s}
nav a .n{font-size:11.5px;font-weight:800;color:var(--muted);letter-spacing:.06em}
nav a .h{font-size:14px;font-weight:700;color:var(--ink)}
nav a .d{font-size:12px;color:var(--muted);line-height:1.4}
nav a:hover{border-color:#d7d9e3}
nav a[aria-current="page"]{border-color:var(--purple);box-shadow:0 0 0 3px var(--purple-soft)}
nav a[aria-current="page"] .n{color:var(--purple)}
nav a:focus-visible{outline:2px solid var(--purple);outline-offset:2px}
.page{display:flex;flex-direction:column;gap:18px}
.page[hidden]{display:none!important}
.title{display:flex;flex-direction:column;gap:4px;margin-top:4px}
h1,h2{color:var(--ink);font-weight:800;margin:0;line-height:1.2;letter-spacing:-.01em;text-wrap:balance}
h1{font-size:clamp(24px,3.2vw,32px)}
h2{font-size:clamp(22px,2.8vw,28px)}
.title p{color:var(--muted);font-size:15px;max-width:72ch;margin:0}
.card{background:var(--card);border-radius:18px;padding:22px 24px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:16px;min-width:0}
.chead{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.chead h3{display:flex;align-items:center;gap:10px;margin:0;font-size:16px;font-weight:700;color:var(--ink)}
.chead h3::before{content:"";width:6px;height:16px;border-radius:3px;background:var(--purple)}
.seg{display:inline-flex;background:var(--bg);border-radius:999px;padding:3px}
.seg button{font:inherit;font-size:12.5px;font-weight:600;color:var(--muted);background:none;border:0;border-radius:999px;padding:6px 14px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(21,24,39,.12)}
.seg button:focus-visible{outline:2px solid var(--purple)}
.grid{display:grid;gap:18px}
.kpis{grid-template-columns:repeat(5,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.kpi{background:var(--card);border-radius:18px;padding:18px 20px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:6px;min-width:0}
.kpi .l{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);font-weight:600}
.kpi .l i{width:9px;height:9px;border-radius:50%}
.kpi .v{font-size:clamp(24px,2.6vw,30px);font-weight:800;color:var(--ink);line-height:1.15;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.kpi .d{font-size:12.5px;color:var(--muted)}
.up{display:inline-block;font-weight:700;color:#2f9a55;background:var(--green-soft);border-radius:999px;padding:0 8px;margin-right:4px}
.down{display:inline-block;font-weight:700;color:#c0504d;background:#fbe9e8;border-radius:999px;padding:0 8px;margin-right:4px}
.tbu{display:inline-block;font-size:11px;font-weight:800;letter-spacing:.08em;color:var(--tbu);background:var(--tbu-soft);border-radius:6px;padding:2px 8px;vertical-align:middle}
.kpi .v .tbu{font-size:14px;padding:5px 10px}
/* perf overview */
.perf{display:grid;grid-template-columns:200px minmax(0,1fr);gap:20px;align-items:start}
.series{display:flex;flex-direction:column;gap:22px;padding-top:8px}
.series .l{display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--muted)}
.series .l i{width:10px;height:10px;border-radius:50%}
.series .v{font-size:24px;font-weight:800;color:var(--ink);padding-left:18px;font-variant-numeric:tabular-nums}
svg{display:block;width:100%;height:auto;overflow:visible}
svg text{font-family:var(--font);fill:var(--muted);font-size:11px}
svg .val{fill:var(--ink);font-weight:700;font-size:12px}
svg .ann{fill:var(--purple);font-weight:600;font-size:10.5px}
/* donut + legend */
.donut{display:grid;grid-template-columns:220px minmax(0,1fr);gap:20px;align-items:center}
.lg{display:flex;flex-direction:column;gap:14px}
.lg div{display:grid;grid-template-columns:14px minmax(0,1fr) auto;gap:10px;align-items:center;font-size:14px}
.lg i{width:10px;height:10px;border-radius:50%}
.lg b{color:var(--ink);font-variant-numeric:tabular-nums}
/* funnel */
.funnel{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:8px 18px;align-items:center}
.fz{display:flex;justify-content:center}
.fz div{height:52px;clip-path:polygon(0 0,100% 0,88% 100%,12% 100%);border-radius:6px}
.flab{display:flex;flex-direction:column;border-bottom:1px dashed var(--line);padding:4px 0}
.flab span{font-size:13px;color:var(--muted)}
.flab b{font-size:20px;color:var(--ink);font-variant-numeric:tabular-nums;line-height:1.2}
.flab em{font-style:normal;font-size:12px;color:var(--purple);font-weight:600}
/* insights */
.ins{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.ins li{display:flex;gap:14px;padding:16px;border-radius:14px;background:#fafafc;border:1px solid var(--line)}
.ins .ic{flex:none;width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px}
.ins b{display:block;color:var(--ink);font-size:14.5px;margin-bottom:2px}
.ins span{font-size:13.5px}
/* tables & bars */
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13.5px;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:12px;border-bottom:1px solid var(--grid);vertical-align:middle}
th{font-size:12px;color:var(--muted);font-weight:600;border-bottom:1px solid var(--line)}
td.r,th.r{text-align:right;white-space:nowrap}
td.nw{white-space:nowrap}
tr.total td{font-weight:800;color:var(--ink);border-top:1.5px solid var(--line);border-bottom:0}
.best{color:#2f9a55;font-weight:800}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:8px;vertical-align:0}
.hbars{display:flex;flex-direction:column;gap:12px}
.hb{display:grid;grid-template-columns:190px minmax(0,1fr) 54px;gap:12px;align-items:center;font-size:13.5px}
.hb .tr{height:10px;background:var(--grid);border-radius:6px;overflow:hidden}
.hb .fi{height:100%;border-radius:6px}
.hb b{text-align:right;color:var(--ink);font-variant-numeric:tabular-nums}
.note{font-size:12.5px;color:var(--muted);margin:0}
.col{display:flex;flex-direction:column;gap:12px}
.col h4{margin:0;font-size:13px;letter-spacing:.06em;text-transform:uppercase;font-weight:800}
.col ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:8px}
.col li b{color:var(--ink)}
ol.plan{list-style:none;margin:0;padding:0;counter-reset:s;display:flex;flex-direction:column;gap:12px}
ol.plan li{counter-increment:s;display:grid;grid-template-columns:36px minmax(0,1fr) auto;gap:14px;align-items:start;padding:14px 16px;border:1px solid var(--line);border-radius:14px}
ol.plan li::before{content:counter(s);width:32px;height:32px;border-radius:10px;background:var(--purple-soft);color:var(--purple);font-weight:800;display:flex;align-items:center;justify-content:center}
ol.plan b{display:block;color:var(--ink)}
ol.plan .when{font-size:12px;font-weight:700;color:var(--muted);background:var(--bg);border-radius:999px;padding:3px 10px;white-space:nowrap}
footer{display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px;font-size:12px;color:var(--muted)}
@media (max-width:1040px){.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}nav{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:760px){
  .kpis,.g2,.g3,.ins{grid-template-columns:repeat(1,minmax(0,1fr))}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  nav{grid-template-columns:repeat(2,minmax(0,1fr))}
  nav a .d{display:none}
  .perf,.donut{grid-template-columns:1fr}
  .series{flex-direction:row;flex-wrap:wrap;gap:14px 22px}
  .series .v{font-size:20px}
  .donut svg{max-width:220px;margin:0 auto}
  .hb{grid-template-columns:110px minmax(0,1fr) 44px}
  .card{padding:18px}
  ol.plan li{grid-template-columns:36px minmax(0,1fr)}
  ol.plan .when{grid-column:2;justify-self:start}
}
@media print{
  body{background:#fff}
  nav{display:none}
  .page,.page[hidden]{display:flex!important;break-after:page}
  .card,.kpi,.period{box-shadow:none;border:1px solid var(--line)}
}
</style>
</head>
