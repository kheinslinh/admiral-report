<style>
/* Layout: songbook index rail on the left, the open song on the right; stacks to one column on phones. */
:root {
  --bg: #f3f5f1;
  --panel: #ffffff;
  --ink: #17251f;
  --muted: #5a6b62;
  --line: #d9e0da;
  --accent: #1f6b4a;      /* berimbau-verde */
  --accent-ink: #ffffff;
  --gold: #b8860b;        /* dendê */
  --chip-c: #1f6b4a;
  --chip-s: #a4462a;
  --chip-m: #4b4c9a;
  --hover: #e8eee9;
  --paper: #ffffff;
  --display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body: "Source Sans 3", "Segoe UI", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1613; --panel: #16201c; --ink: #e6efe9; --muted: #95a89d; --line: #27352e;
    --accent: #5cc493; --accent-ink: #0b1310; --gold: #e0b44c;
    --chip-c: #5cc493; --chip-s: #e98a6c; --chip-m: #9d9ff0; --hover: #1d2a24; --paper: #f4f4f0;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1613; --panel: #16201c; --ink: #e6efe9; --muted: #95a89d; --line: #27352e;
  --accent: #5cc493; --accent-ink: #0b1310; --gold: #e0b44c;
  --chip-c: #5cc493; --chip-s: #e98a6c; --chip-m: #9d9ff0; --hover: #1d2a24; --paper: #f4f4f0;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 16px; line-height: 1.5;
  display: flex; flex-direction: column;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.wrap { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
header.top {
  padding-block: 14px; border-bottom: 1px solid var(--line); display: flex; flex-wrap: wrap; gap: 12px 20px;
  align-items: center; justify-content: space-between;
}
.brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
.brand svg { flex: none; }
.brand h1 { font-family: var(--display); font-weight: 800; font-size: 1.45rem; margin: 0; letter-spacing: -0.01em; line-height: 1.1; }
.brand p { margin: 0; color: var(--muted); font-size: 0.85rem; }
.pdfstate { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; font-size: 0.9rem; }
.pill { font-family: var(--mono); font-size: 0.75rem; padding: 3px 9px; border-radius: 99px; border: 1px solid var(--line); color: var(--muted); }
.pill.ok { border-color: var(--accent); color: var(--accent); }
button, .btn {
  font: inherit; font-weight: 600; font-size: 0.9rem; cursor: pointer; border-radius: 8px; padding: 7px 14px;
  border: 1px solid var(--accent); background: var(--accent); color: var(--accent-ink); text-decoration: none;
  display: inline-flex; align-items: center; gap: 8px; line-height: 1.2;
}
button.ghost, .btn.ghost { background: transparent; color: var(--ink); border-color: var(--line); }
button:focus-visible, .btn:focus-visible, input:focus-visible, .song:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
.app { flex: 1; display: grid; grid-template-columns: minmax(280px, 360px) 1fr; min-height: 0; }
aside.index { border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; background: var(--panel); }
.filters { padding-block: 14px 10px; display: grid; gap: 10px; border-bottom: 1px solid var(--line); }
#q {
  width: 100%; font: inherit; padding: 9px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--ink);
}
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font-size: 0.8rem; font-weight: 600; padding: 4px 10px; border-radius: 99px; background: transparent; color: var(--muted); border: 1px solid var(--line); }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.count { font-size: 0.8rem; color: var(--muted); font-family: var(--mono); }
.list { overflow-y: auto; flex: 1; min-height: 0; padding-block: 6px 24px; }
.letter { font-family: var(--display); font-weight: 700; color: var(--gold); font-size: 0.85rem; padding: 12px 0 2px; letter-spacing: 0.08em; }
.song {
  display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; width: 100%; text-align: left; background: transparent;
  border: 0; border-radius: 8px; padding: 8px 10px; color: var(--ink); font-weight: 400; margin-inline: -10px; width: calc(100% + 20px);
}
.song:hover { background: var(--hover); }
.song[aria-current="true"] { background: var(--hover); box-shadow: inset 3px 0 0 var(--accent); }
.song .t { font-weight: 600; font-size: 0.97rem; min-width: 0; }
.song .e { grid-column: 1; color: var(--muted); font-size: 0.85rem; font-style: italic; min-width: 0; }
.song .k { grid-row: 1 / span 2; grid-column: 2; align-self: center; display: flex; gap: 6px; align-items: center; }
.dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
.dot.c { background: var(--chip-c); } .dot.s { background: var(--chip-s); } .dot.m { background: var(--chip-m); }
.star { color: var(--gold); font-size: 0.9rem; }
.hit { font-size: 0.78rem; color: var(--muted); grid-column: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hit mark { background: color-mix(in srgb, var(--gold) 35%, transparent); color: inherit; border-radius: 2px; }
main.detail { overflow-y: auto; min-height: 0; padding-block: 24px 48px; }
.detail-inner { max-width: 880px; margin: 0 auto; display: grid; gap: 18px; }
.back { display: none; }
.eyebrow { display: flex; gap: 10px; align-items: center; font-size: 0.8rem; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); flex-wrap: wrap; }
.eyebrow .sec { color: var(--sec, var(--accent)); }
h2.title { font-family: var(--display); font-weight: 800; font-size: clamp(1.8rem, 4vw, 2.7rem); line-height: 1.05; margin: 4px 0 0; text-wrap: balance; letter-spacing: -0.015em; }
.subtitle { font-size: 1.15rem; color: var(--muted); font-style: italic; margin: 6px 0 0; }
.actions { display: flex; flex-wrap: wrap; gap: 10px; }
.btn.yt { background: #c4302b; border-color: #c4302b; color: #fff; }
.btn.sp { background: #1db954; border-color: #1db954; color: #08130c; }
.btn svg { width: 18px; height: 18px; flex: none; }
.listen-note { font-size: 0.82rem; color: var(--muted); margin: -8px 0 0; }
.sheet { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 16px; display: grid; gap: 10px; }
.sheet canvas { width: 100%; height: auto; display: block; background: var(--paper); border-radius: 6px; }
.sheet .src { font-family: var(--mono); font-size: 0.75rem; color: var(--muted); display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.drop {
  border: 2px dashed var(--line); border-radius: 12px; padding: 28px 20px; text-align: center; display: grid; gap: 10px; justify-items: center;
  background: var(--panel);
}
.drop.over { border-color: var(--accent); background: var(--hover); }
.drop h3 { font-family: var(--display); margin: 0; font-size: 1.2rem; }
.drop p { margin: 0; color: var(--muted); max-width: 52ch; }
.navrow { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.credit { font-size: 0.8rem; color: var(--muted); border-top: 1px solid var(--line); padding-top: 14px; }
.credit p { margin: 0 0 6px; max-width: 70ch; }
.err { color: var(--chip-s); font-size: 0.9rem; }
@media (max-width: 760px) {
  .app { grid-template-columns: 1fr; }
  aside.index { border-right: 0; }
  body.show-detail aside.index { display: none; }
  body:not(.show-detail) main.detail { display: none; }
  .back { display: inline-flex; justify-self: start; }
  .sheet { padding: 8px; }
}
@media (prefers-reduced-motion: no-preference) { .song, button, .btn { transition: background-color .15s, border-color .15s; } }
</style>

function matches(i) {
  const s = SONGS[i];
  if (state.filter === "fav" && !state.favs.has(i)) return null;
  if (["c", "s", "m"].includes(state.filter) && s.s !== state.filter) return null;
  if (!state.q) return { hit: "" };
  const q = norm(state.q);
  if (norm(s.t).includes(q) || norm(s.e).includes(q)) return { hit: "" };
  const body = state.text && state.text[i];
  if (body) {
    const n = norm(body), at = n.indexOf(q);
    if (at >= 0) {
      const a = Math.max(0, at - 18), b = Math.min(body.length, at + q.length + 30);
      return { hit: (a ? "…" : "") + esc(body.slice(a, at)) + "<mark>" + esc(body.slice(at, at + q.length)) + "</mark>" + esc(body.slice(at + q.length, b)) + "…" };
    }
  }
  return null;
}
function renderList() {
  const order = SONGS.map((s, i) => i).sort((a, b) => {
    const sa = "csm".indexOf(SONGS[a].s), sb = "csm".indexOf(SONGS[b].s);
    return sa - sb || norm(SONGS[a].t).localeCompare(norm(SONGS[b].t));
  });
  let html = "", last = "", n = 0;
  for (const i of order) {
    const m = matches(i); if (!m) continue; n++;
    const s = SONGS[i];
    const head = s.s === "c" ? norm(s.t).replace(/^[^a-z]+/, "")[0].toUpperCase() : SECTION[s.s];
    if (head !== last) { html += `<div class="letter">${esc(head)}</div>`; last = head; }
    html += `<button class="song" type="button" data-i="${i}" ${i === state.current ? 'aria-current="true"' : ""}>
      <span class="t">${esc(s.t)}</span><span class="k">${state.favs.has(i) ? '<span class="star" aria-label="saved">★</span>' : ""}<span class="dot ${s.s}" title="${SECTION[s.s]}"></span></span>
      ${s.e && norm(s.e) !== norm(s.t) ? `<span class="e">${esc(s.e)}</span>` : ""}
      ${m.hit ? `<span class="hit">${m.hit}</span>` : ""}</button>`;
  }
  $("#list").innerHTML = html || '<p class="count">No songs match. Try fewer words, or load the PDF to search the lyrics too.</p>';
  $("#count").textContent = `${n} of ${SONGS.length} songs` + (state.q && !state.text ? " · title search only until the PDF is loaded" : "");
}

const pageCache = new Map();
async function renderPage(p, scale) {
  const key = p + ":" + scale;
  if (pageCache.has(key)) return pageCache.get(key);
  const job = (async () => {
    const page = await state.pdf.getPage(p);
    const vp = page.getViewport({ scale });
    const c = document.createElement("canvas");
    c.width = Math.ceil(vp.width); c.height = Math.ceil(vp.height);
    await page.render({ canvasContext: c.getContext("2d"), viewport: vp }).promise;
    return c;
  })();
  pageCache.set(key, job);
  if (pageCache.size > 12) pageCache.delete(pageCache.keys().next().value);
  return job;
}

  for (const [p, h, y0, y1] of s.g) {
    const full = await renderPage(p, scale);

function idb(mode, fn) {
  return new Promise((res, rej) => {
    let req;
    try { req = indexedDB.open("roda-songbook", 1); } catch (e) { return rej(e); }
    req.onupgradeneeded = () => req.result.createObjectStore("files");
    req.onerror = () => rej(req.error);
    req.onsuccess = () => {
      try {
        const tx = req.result.transaction("files", mode), st = tx.objectStore("files");
        const r = fn(st); tx.oncomplete = () => res(r && r.result); tx.onerror = () => rej(tx.error);
      } catch (e) { rej(e); }
    };
  });
}

  const text = SONGS.map(() => "");
  const byPage = new Map();
  SONGS.forEach((s, i) => s.g.forEach((g) => { (byPage.get(g[0]) || byPage.set(g[0], []).get(g[0])).push([i, ...g]); }));
  for (const [p, segs] of byPage) {
    const page = await state.pdf.getPage(p);
    const vp = page.getViewport({ scale: 1 });
    const tc = await page.getTextContent();
    for (const it of tc.items) {
      if (!it.str || !it.str.trim()) continue;
      const [x, y] = vp.convertToViewportPoint(it.transform[4], it.transform[5]);
      const h = x < HALF_W ? 0 : 1, top = y - Math.abs(it.transform[3]) * 0.8;
      for (const [i, , sh, y0, y1] of segs) if (sh === h && top >= y0 - 2 && top <= y1) { text[i] += it.str + " "; break; }
    }
  }
  state.text = text.map((t) => t.replace(/\s+/g, " ").trim());
  renderList();
}
function handleFile(f) {
  if (!f) return;
  f.arrayBuffer().then((b) => openPdf(b, true));
}
function wireDrop(el) {
  ["dragenter", "dragover"].forEach((ev) => el.addEventListener(ev, (e) => { e.preventDefault(); el.classList.add("over"); }));
  ["dragleave", "drop"].forEach((ev) => el.addEventListener(ev, (e) => { e.preventDefault(); el.classList.remove("over"); }));
  el.addEventListener("drop", (e) => handleFile(e.dataTransfer.files[0]));
}
$("#loadBtn").onclick = () => $("#file").click();
$("#file").onchange = (e) => handleFile(e.target.files[0]);
document.addEventListener("dragover", (e) => e.preventDefault());
document.addEventListener("drop", (e) => { e.preventDefault(); if (e.dataTransfer.files[0]) handleFile(e.dataTransfer.files[0]); });

// ---------- routing ----------
function route() {
  const m = /^#song-(\d+)$/.exec(location.hash);
  const i = m ? Math.min(SONGS.length - 1, +m[1]) : state.current;
  state.current = i;
  if (m) document.body.classList.add("show-detail");
  renderDetail(); renderList();
  const cur = document.querySelector('.song[aria-current="true"]');
  if (cur && m) cur.scrollIntoView({ block: "nearest" });
  $("#detail").scrollTop = 0;
}
window.addEventListener("hashchange", route);
let resizeT; window.addEventListener("resize", () => { clearTimeout(resizeT); resizeT = setTimeout(() => { if (state.pdf) renderLyrics(); }, 250); });
route();
idb("readonly", (st) => st.get("compendium")).then((buf) => { if (buf) openPdf(buf, false); }).catch(() => {});
</script>
